<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情報閲覧ページ</title>
</head>

<body>

  <h1>情報閲覧ページ</h1>

  <button onclick="loadLocations()">
    保存されている位置情報を取得
  </button>

  <p id="status"></p>

  <div id="locations"></div>

  <script>
    function loadLocations() {
      const locations = document.getElementById("locations");
      const status = document.getElementById("status");

      status.textContent = "読み込み中...";
      locations.innerHTML = "";

      fetch("/location")
        .then(response => {
          if (!response.ok) {
            throw new Error("取得に失敗しました");
          }
          return response.json();
        })
        .then(data => {

          if (!Array.isArray(data) || data.length === 0) {
            status.textContent = "保存されている位置情報はありません。";
            return;
          }

          status.textContent =
            data.length + "件の位置情報があります。";

          data.forEach((location, index) => {

            const box = document.createElement("div");

            const time = new Date(location.created_at);

            box.innerHTML = `
              <hr>
              <p><strong>${index + 1}件目</strong></p>
              <p>日時：${time.toLocaleString("ja-JP")}</p>
              <p>緯度：${location.latitude}</p>
              <p>経度：${location.longitude}</p>
            `;

            locations.appendChild(box);
          });
        })
        .catch(error => {
          status.textContent =
            "位置情報を取得できませんでした。";
          console.error(error);
        });
    }
  </script>

</body>
</html>
